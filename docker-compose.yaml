# Production: https://www.doucettes.org on the Synology NAS, run as a Container Manager project.
# Step-by-step setup: docs/christmas-plan.md, "Deploying to the NAS".
#
# The image is built by GitHub Actions (.github/workflows/build_push.yml) on every push to main.
# Paths on the left are relative to this file's folder on the NAS (e.g. /volume1/docker/secretgifts).
services:
    app:
        container_name: wishlist-prod
        image: ghcr.io/atonaltensor/secretgifts:main
        # Always check for a newer image when the project starts, so "stop, then build" updates it.
        pull_policy: always
        restart: unless-stopped
        ports:
            # NAS port 9000 (where the reverse proxy sends traffic) -> the app's port 3280 inside the container.
            - 9000:3280
        volumes:
            # The database. Back this folder up.
            - ./data:/usr/src/app/data
            # Pictures people upload for gifts. Back this folder up too.
            - ./uploads:/usr/src/app/uploads
            # Real family data: never in git or the image, so copy them to the NAS by hand.
            - ./family.json:/usr/src/app/family.json:ro
            - ./images/christmas_avatars:/usr/src/app/images/christmas_avatars:ro
        environment:
            # Must be the exact address people visit, or logins and forms are rejected.
            ORIGIN: https://www.doucettes.org
            TOKEN_TIME: 72
            DEFAULT_CURRENCY: USD
            LOG_LEVEL: info
            MAX_IMAGE_SIZE: 5000000
