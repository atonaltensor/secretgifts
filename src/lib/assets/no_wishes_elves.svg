<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560">
  <defs>
    <pattern id="stripes" width="16" height="12" patternUnits="userSpaceOnUse">
      <rect width="16" height="12" fill="#ffffff"/>
      <rect width="16" height="6" fill="#dc2626"/>
    </pattern>
  </defs>

  <!-- snow -->
  <g fill="#cbd5e1">
    <circle cx="90" cy="70" r="5"/>
    <circle cx="260" cy="40" r="4"/>
    <circle cx="350" cy="120" r="6"/>
    <circle cx="480" cy="60" r="4"/>
    <circle cx="560" cy="150" r="5"/>
    <circle cx="700" cy="80" r="6"/>
    <circle cx="740" cy="220" r="4"/>
    <circle cx="60" cy="230" r="4"/>
    <circle cx="300" cy="230" r="3"/>
    <circle cx="620" cy="30" r="3"/>
  </g>

  <!-- ground shadows -->
  <g fill="#000000" opacity="0.08">
    <ellipse cx="185" cy="522" rx="70" ry="10"/>
    <ellipse cx="410" cy="520" rx="115" ry="12"/>
    <ellipse cx="615" cy="522" rx="70" ry="10"/>
  </g>

  <!-- empty gift box -->
  <g>
    <polygon points="480,390 510,370 510,495 480,515" fill="#b91c1c"/>
    <polygon points="492,382 500,377 500,503 492,508" fill="#eab308"/>
    <rect x="320" y="390" width="160" height="125" fill="#dc2626"/>
    <rect x="390" y="390" width="20" height="125" fill="#facc15"/>
    <polygon points="320,390 480,390 510,370 350,370" fill="#7f1d1d"/>
    <polygon points="335,388 478,388 500,374 357,374" fill="#5b1414"/>
  </g>

  <!-- popped lid -->
  <g transform="rotate(-16 330 330)">
    <rect x="300" y="300" width="190" height="34" rx="4" fill="#dc2626"/>
    <rect x="300" y="326" width="190" height="8" fill="#b91c1c"/>
    <rect x="385" y="300" width="20" height="34" fill="#facc15"/>
    <ellipse cx="378" cy="288" rx="22" ry="13" fill="none" stroke="#facc15" stroke-width="8"/>
    <ellipse cx="412" cy="288" rx="22" ry="13" fill="none" stroke="#facc15" stroke-width="8"/>
    <circle cx="395" cy="296" r="9" fill="#eab308"/>
  </g>

  <!-- elf with clipboard (left) -->
  <g transform="translate(185 520) scale(1.15)">
    <!-- boots -->
    <path d="M-30,0 L-8,0 L-8,-16 L-26,-16 Q-40,-16 -42,-24 Q-44,-12 -30,0 Z" fill="#7c2d12"/>
    <path d="M30,0 L8,0 L8,-16 L26,-16 Q40,-16 42,-24 Q44,-12 30,0 Z" fill="#7c2d12"/>
    <!-- legs -->
    <rect x="-24" y="-70" width="16" height="56" fill="url(#stripes)"/>
    <rect x="8" y="-70" width="16" height="56" fill="url(#stripes)"/>
    <!-- tunic -->
    <path d="M-30,-152 L30,-152 L48,-65 L36,-55 L24,-65 L12,-55 L0,-65 L-12,-55 L-24,-65 L-36,-55 L-48,-65 Z" fill="#15803d"/>
    <rect x="-41" y="-100" width="82" height="12" fill="#1f2937"/>
    <!-- arms -->
    <path d="M-28,-146 L-14,-110" stroke="#15803d" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M28,-146 L14,-110" stroke="#15803d" stroke-width="16" stroke-linecap="round" fill="none"/>
    <!-- clipboard -->
    <rect x="-24" y="-132" width="48" height="58" rx="4" fill="#a16207"/>
    <rect x="-18" y="-124" width="36" height="44" fill="#ffffff"/>
    <rect x="-9" y="-137" width="18" height="9" rx="2" fill="#9ca3af"/>
    <g stroke="#cbd5e1" stroke-width="3" stroke-linecap="round">
      <line x1="-12" y1="-114" x2="12" y2="-114"/>
      <line x1="-12" y1="-104" x2="12" y2="-104"/>
      <line x1="-12" y1="-94" x2="4" y2="-94"/>
    </g>
    <circle cx="-15" cy="-106" r="8" fill="#f5c6a0"/>
    <circle cx="15" cy="-106" r="8" fill="#f5c6a0"/>
    <!-- collar -->
    <polygon points="-34,-150 -24,-138 -12,-150 0,-138 12,-150 24,-138 34,-150 30,-160 -30,-160" fill="#dc2626"/>
    <!-- ears -->
    <polygon points="-27,-194 -54,-212 -30,-176" fill="#eab08a"/>
    <polygon points="27,-194 54,-212 30,-176" fill="#eab08a"/>
    <!-- head -->
    <circle cx="0" cy="-186" r="32" fill="#f5c6a0"/>
    <circle cx="-17" cy="-176" r="6" fill="#f87171" opacity="0.5"/>
    <circle cx="17" cy="-176" r="6" fill="#f87171" opacity="0.5"/>
    <circle cx="-11" cy="-190" r="3.5" fill="#1f2937"/>
    <circle cx="11" cy="-190" r="3.5" fill="#1f2937"/>
    <path d="M-10,-175 Q0,-166 10,-175" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- hat -->
    <path d="M-33,-210 Q-12,-268 44,-284 Q18,-252 33,-210 Z" fill="#16a34a"/>
    <rect x="-37" y="-218" width="74" height="15" rx="7" fill="#dc2626"/>
    <circle cx="46" cy="-285" r="9" fill="#ffffff"/>
  </g>

  <!-- waving elf (right, mirrored) -->
  <g transform="translate(615 520) scale(-1.15 1.15)">
    <!-- boots -->
    <path d="M-30,0 L-8,0 L-8,-16 L-26,-16 Q-40,-16 -42,-24 Q-44,-12 -30,0 Z" fill="#7c2d12"/>
    <path d="M30,0 L8,0 L8,-16 L26,-16 Q40,-16 42,-24 Q44,-12 30,0 Z" fill="#7c2d12"/>
    <!-- legs -->
    <rect x="-24" y="-70" width="16" height="56" fill="url(#stripes)"/>
    <rect x="8" y="-70" width="16" height="56" fill="url(#stripes)"/>
    <!-- arms (behind tunic) -->
    <path d="M-28,-146 L-46,-98" stroke="#b91c1c" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M28,-146 L52,-196" stroke="#b91c1c" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="-48" cy="-92" r="8" fill="#f5c6a0"/>
    <circle cx="55" cy="-203" r="9" fill="#f5c6a0"/>
    <!-- tunic -->
    <path d="M-30,-152 L30,-152 L48,-65 L36,-55 L24,-65 L12,-55 L0,-65 L-12,-55 L-24,-65 L-36,-55 L-48,-65 Z" fill="#dc2626"/>
    <rect x="-41" y="-100" width="82" height="12" fill="#1f2937"/>
    <rect x="-9" y="-102" width="18" height="16" fill="none" stroke="#facc15" stroke-width="4"/>
    <!-- collar -->
    <polygon points="-34,-150 -24,-138 -12,-150 0,-138 12,-150 24,-138 34,-150 30,-160 -30,-160" fill="#16a34a"/>
    <!-- ears -->
    <polygon points="-27,-194 -54,-212 -30,-176" fill="#c98b62"/>
    <polygon points="27,-194 54,-212 30,-176" fill="#c98b62"/>
    <!-- head -->
    <circle cx="0" cy="-186" r="32" fill="#d9a07a"/>
    <circle cx="-17" cy="-176" r="6" fill="#f87171" opacity="0.45"/>
    <circle cx="17" cy="-176" r="6" fill="#f87171" opacity="0.45"/>
    <circle cx="-11" cy="-190" r="3.5" fill="#1f2937"/>
    <circle cx="11" cy="-190" r="3.5" fill="#1f2937"/>
    <path d="M-11,-176 Q0,-163 11,-176 Z" fill="#7f1d1d"/>
    <!-- hat -->
    <path d="M-33,-210 Q-12,-268 44,-284 Q18,-252 33,-210 Z" fill="#dc2626"/>
    <rect x="-37" y="-218" width="74" height="15" rx="7" fill="#16a34a"/>
    <circle cx="46" cy="-285" r="9" fill="#ffffff"/>
  </g>
</svg>
