<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560">
  <defs>
    <pattern id="stripes" width="16" height="12" patternUnits="userSpaceOnUse">
      <rect width="16" height="12" fill="#ffffff"/>
      <rect width="16" height="6" fill="#dc2626"/>
    </pattern>
  </defs>

  <!-- snow -->
  <g fill="#cbd5e1">
    <circle cx="90" cy="70" r="5"/>
    <circle cx="260" cy="40" r="4"/>
    <circle cx="350" cy="150" r="6"/>
    <circle cx="480" cy="60" r="4"/>
    <circle cx="560" cy="170" r="5"/>
    <circle cx="700" cy="80" r="6"/>
    <circle cx="750" cy="240" r="4"/>
    <circle cx="60" cy="230" r="4"/>
    <circle cx="170" cy="160" r="3"/>
    <circle cx="620" cy="30" r="3"/>
  </g>

  <!-- ground shadows -->
  <g fill="#000000" opacity="0.08">
    <ellipse cx="335" cy="512" rx="190" ry="12"/>
    <ellipse cx="635" cy="512" rx="70" ry="10"/>
  </g>

  <!-- empty sleigh -->
  <g>
    <!-- struts -->
    <g stroke="#ca8a04" stroke-width="8" stroke-linecap="round">
      <line x1="225" y1="500" x2="225" y2="455"/>
      <line x1="320" y1="500" x2="320" y2="455"/>
      <line x1="415" y1="500" x2="415" y2="455"/>
    </g>
    <!-- runner -->
    <path d="M150,486 Q150,500 170,500 L480,500 Q530,500 530,460 Q530,436 508,436" stroke="#eab308" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- body -->
    <path d="M190,462 L445,462 Q488,462 494,418 Q500,372 472,346 Q462,372 448,392 L262,392 Q264,322 222,312 Q192,308 186,342 Z" fill="#dc2626"/>
    <path d="M262,392 L448,392 L444,402 L262,402 Z" fill="#7f1d1d"/>
    <path d="M200,446 L446,446" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
    <path d="M212,330 Q240,330 244,392" stroke="#facc15" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="472" cy="350" r="7" fill="#facc15"/>
    <!-- holly -->
    <g transform="translate(330 422)">
      <ellipse cx="-12" cy="0" rx="13" ry="6" fill="#16a34a" transform="rotate(-20 -12 0)"/>
      <ellipse cx="12" cy="0" rx="13" ry="6" fill="#16a34a" transform="rotate(20 12 0)"/>
      <circle cx="-3" cy="-4" r="4.5" fill="#b91c1c"/>
      <circle cx="4" cy="-6" r="4.5" fill="#b91c1c"/>
      <circle cx="1" cy="1" r="4.5" fill="#b91c1c"/>
    </g>
  </g>

  <!-- shrugging elf -->
  <g transform="translate(635 510) scale(1.15)">
    <!-- boots -->
    <path d="M-30,0 L-8,0 L-8,-16 L-26,-16 Q-40,-16 -42,-24 Q-44,-12 -30,0 Z" fill="#7c2d12"/>
    <path d="M30,0 L8,0 L8,-16 L26,-16 Q40,-16 42,-24 Q44,-12 30,0 Z" fill="#7c2d12"/>
    <!-- legs -->
    <rect x="-24" y="-70" width="16" height="56" fill="url(#stripes)"/>
    <rect x="8" y="-70" width="16" height="56" fill="url(#stripes)"/>
    <!-- shrugging arms -->
    <path d="M-26,-144 Q-58,-118 -64,-150" stroke="#15803d" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M26,-144 Q58,-118 64,-150" stroke="#15803d" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="-66" cy="-157" r="8" fill="#f5c6a0"/>
    <circle cx="66" cy="-157" r="8" fill="#f5c6a0"/>
    <!-- tunic -->
    <path d="M-30,-152 L30,-152 L48,-65 L36,-55 L24,-65 L12,-55 L0,-65 L-12,-55 L-24,-65 L-36,-55 L-48,-65 Z" fill="#15803d"/>
    <rect x="-41" y="-100" width="82" height="12" fill="#1f2937"/>
    <rect x="-9" y="-102" width="18" height="16" fill="none" stroke="#facc15" stroke-width="4"/>
    <!-- collar -->
    <polygon points="-34,-150 -24,-138 -12,-150 0,-138 12,-150 24,-138 34,-150 30,-160 -30,-160" fill="#dc2626"/>
    <!-- ears -->
    <polygon points="-27,-194 -54,-212 -30,-176" fill="#eab08a"/>
    <polygon points="27,-194 54,-212 30,-176" fill="#eab08a"/>
    <!-- head -->
    <circle cx="0" cy="-186" r="32" fill="#f5c6a0"/>
    <circle cx="-17" cy="-176" r="6" fill="#f87171" opacity="0.5"/>
    <circle cx="17" cy="-176" r="6" fill="#f87171" opacity="0.5"/>
    <circle cx="-11" cy="-190" r="3.5" fill="#1f2937"/>
    <circle cx="11" cy="-190" r="3.5" fill="#1f2937"/>
    <g stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M-17,-200 Q-11,-205 -5,-201"/>
      <path d="M5,-201 Q11,-205 17,-200"/>
    </g>
    <ellipse cx="0" cy="-172" rx="4.5" ry="5.5" fill="#7f1d1d"/>
    <!-- hat -->
    <path d="M-33,-210 Q-12,-268 44,-284 Q18,-252 33,-210 Z" fill="#dc2626"/>
    <rect x="-37" y="-218" width="74" height="15" rx="7" fill="#16a34a"/>
    <circle cx="46" cy="-285" r="9" fill="#ffffff"/>
  </g>
</svg>
