name: Build and Push Docker Image

# Builds the production image and publishes it to GitHub's container registry as
# ghcr.io/<owner>/<repo>, for the Synology NAS to download (see docs/christmas-plan.md,
# "Deploying to the NAS"). The image holds no family data: .dockerignore keeps it out.
#
# Tags: `main` (latest build of main, what the NAS runs) and `sha-<commit>` (to roll back).

permissions:
    contents: read
    packages: write

on:
    workflow_dispatch:
    push:
        branches: [main]

concurrency:
    group: build-push-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build_and_push_web:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker Tags
              id: tags
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=ref,event=branch
                      type=sha,prefix=sha-

            - name: Build and Push Web
              uses: docker/build-push-action@v7
              with:
                  context: ./
                  file: ./Dockerfile
                  # The NAS has an Intel Celeron J3455; the Dockerfile already targets plain x86-64.
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.tags.outputs.tags }}
                  labels: ${{ steps.tags.outputs.labels }}
                  build-args: |
                      SHA=${{ github.sha }}
                      VERSION=${{ github.ref_name }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
